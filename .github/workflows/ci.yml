name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: macos-15

    steps:
      - uses: actions/checkout@v4

      - name: Select latest available Xcode
        run: |
          LATEST_XCODE=$(ls -d /Applications/Xcode_*.app 2>/dev/null | sort -V | tail -1)
          echo "Using $LATEST_XCODE"
          sudo xcode-select -s "$LATEST_XCODE/Contents/Developer"
          xcodebuild -version

      - name: Build
        run: |
          xcodebuild -scheme scanner \
            -destination "generic/platform=iOS Simulator" \
            -configuration Debug \
            build

      - name: Run tests
        run: |
          xcodebuild test -scheme scanner \
            -destination "platform=iOS Simulator,name=iPhone 16" \
            -only-testing:scannerTests
